abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>This article
  proposes an efficient correction model that enables the extension of the blade element
  momentum method (BEM) for swept blades. Standard BEM algorithms, assuming a straight
  blade in the rotor plane, cannot account for the changes in the induction system
  introduced by blade sweep. The proposed extension corrects the axial induction regarding
  two aspects: the azimuthal displacement of the trailed vorticity system and the
  induction of the curved bound vortex on itself. The extended algorithm requires
  little additional processing work and maintains BEM's streamtube independent approach.
  The proposed correction model is applied to simulations of swept blade geometries
  based on the IEA 15 MW reference wind turbine. Results show good agreement with
  lifting line simulations that inherently can account for the swept blade geometry.</jats:p>\n
  \                 <jats:p>Blade sweep couples bending and torsion deformations by
  curving the blade axis in the inplane direction. As such, it can be used to passively
  alleviate loads and, thus, aeroelastically tailor wind turbine blades. The implementation
  of aeroelastic tailoring techniques, and the aeroelastic analysis in general, becomes
  increasingly significant with the size of wind turbine rotors continually rising.
  Due to its low computing complexity, BEM remains a crucial tool in the aerodynamic
  and aeroelastic analysis of wind turbine rotors. Thus, the proposed correction model
  contributes to a fast and accurate evaluation of swept blade designs.</jats:p>"
