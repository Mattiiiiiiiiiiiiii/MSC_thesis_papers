abstract: "<jats:title>ABSTRACT</jats:title>\n                  <jats:p>The blade
  element momentum (BEM) equations, though conceptually simple, can be challenging
  to solve reliably and efficiently with high precision. These requirements are particularly
  important for efficient rotor blade optimization that utilizes gradient‐based algorithms.
  Many solution approaches exist for numerically converging the axial and tangential
  induction factors. These methods all generally suffer from a lack of robustness
  in some regions of the rotor blade design space, or require significantly increased
  complexity to promote convergence. The approach described here allows for the BEM
  equations to be parameterized by one variable—the local inflow angle. This reduction
  is mathematically equivalent, but greatly simplifies the solution approach. Namely,
  it allows for the use of one‐dimensional root‐finding algorithms for which very
  robust and efficient algorithms exist. This paper also discusses an appropriate
  arrangement of the equation and corresponding bounds for the one‐dimensional search—intervals
  that bracket the solution and over which the function is well behaved. The result
  is a methodology for solving the BEM equations with guaranteed convergence and at
  a superlinear rate.Copyright © 2013 John Wiley &amp; Sons, Ltd.</jats:p>"
