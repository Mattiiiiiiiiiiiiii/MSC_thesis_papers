abstract: <jats:p>The complex-step derivative approximation and its application to
  numerical algorithms are presented. Improvements to the basic method are suggested
  that further increase its accuracy and robustness and unveil the connection to algorithmic
  differentiation theory. A general procedure for the implementation of the complex-step
  method is described in detail and a script is developed that automates its implementation.
  Automatic implementations of the complex-step method for Fortran and C/C++ are presented
  and compared to existing algorithmic differentiation tools. The complex-step method
  is tested in two large multidisciplinary solvers and the resulting sensitivities
  are compared to results given by finite differences. The resulting sensitivities
  are shown to be as accurate as the analyses. Accuracy, robustness, ease of implementation
  and maintainability make these complex-step derivative approximation tools very
  attractive options for sensitivity analysis.</jats:p>
