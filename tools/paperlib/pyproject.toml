[project]
name = "paperlib"
version = "0.1.0"
description = "papis based paper library tooling for the thesis"
authors = [
    {name = "Matthias Henssler", email = "matthias.henssler@harmattan.ai"}
]
dynamic = ["dependencies"]
requires-python = ">=3.12, <3.13"

[project.scripts]
paper = "paperlib.cli:main"

[project.entry-points."papis.format"]
thesis = "paperlib.papis_formatter:ThesisFormatter"

[tool.poetry]
packages = [{include = "paperlib", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- dependencies ---
[tool.poetry.dependencies]
papis = ">=0.16.1,<0.17"
pyyaml = ">=6.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.1,<10.0.0"

[tool.poetry.group.dev]
optional = true
include-groups = ["test"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.0"

# --- tool configurations ---
[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
pretty = true
disable_error_code = [
    "index",
    "var-annotated",
    "has-type",
    "operator"
]

[tool.ruff.lint]
preview = true  # needed for pydoclint
extend-select = [
    "I",    # isort
    "D",    # pydocstyle
    "DOC",  # pydoclint
    "G",    # flake8-logging-format
    "ERA",  # flake8-eradicate
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"**/{tests}/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
