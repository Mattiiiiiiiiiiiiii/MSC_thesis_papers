name: ci

on: [push]

jobs:
  coding-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-in-project: true
      - name: Check project install
        run: poetry install --all-groups
      - name: Check project build
        run: poetry build
      - name: Check source distribution (.tar.gz)
        run: pip install dist/*.tar.gz --force-reinstall
      - name: Check wheel distribution (.whl)
        run: pip install dist/*.whl --force-reinstall
      - name: Check import
        run: python -c "import paperlib; print(paperlib.__version__)"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-in-project: true
      - name: Install project with test dependencies
        run: poetry install --with test
      - name: Run tests
        run: poetry run pytest tests/
