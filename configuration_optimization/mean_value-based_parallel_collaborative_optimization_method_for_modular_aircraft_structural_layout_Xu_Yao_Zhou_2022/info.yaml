abstract: <jats:p>The conventional structural layout optimization method is usually
  used to solve the layout optimization problem of a single structure, but it is difficult
  to apply to the layout optimization problem of the modular aircraft structure containing
  multiple substructures. Therefore, this paper proposes the mean value-based parallel
  collaborative optimization method (MVPM) for modular aircraft structural layout.
  This method is a two-stage optimization method based on decomposition. The basic
  idea of the MVPM is decomposing the layout optimization problem of the modular aircraft
  structure into a system coordination problem and several independent subsystem optimization
  problems by introducing coordination variables. The subsystem optimizes each aircraft
  structure. Under the constraints of the structure itself, the performance of each
  structure is better, and the shared variables are as close to the coordination variables
  as possible. The system coordination adjusts the coordination variables according
  to the optimization results of each subsystem. With constant iteration between the
  system and subsystems, the shared variables of each subsystem eventually agree with
  the coordination variables. The numerical test results show that the MVPM has high
  optimization efficiency and stability.</jats:p>
