abstract: <jats:p>The conceptual design of unmanned aerial vehicles (UAVs) presents
  significant multidisciplinary challenges requiring the optimization of aerodynamic
  and structural performance, stealth, and propulsion efficiency. This work addresses
  these challenges by integrating deep neural networks with a multiobjective genetic
  algorithm to optimize UAV configurations. The proposed framework enables a comprehensive
  evaluation of design alternatives by estimating key performance metrics required
  for different operational requirements. The design process resulted in a significant
  improvement in computational time over traditional methods by more than three orders
  of magnitude. The findings illustrate the framework’s capability to optimize UAV
  designs for a variety of mission scenarios, including specialized tasks such as
  intelligence, surveillance, and reconnaissance (ISR), combat air patrol (CAP), and
  Suppression of Enemy Air Defenses (SEAD). This flexibility and adaptability was
  demonstrated through a case study, showcasing the method’s effectiveness in tailoring
  UAV configurations to meet specific operational requirements while balancing trade-offs
  between aerodynamic efficiency, stealth, and structural weight. Additionally, these
  results underscore the transformative impact of integrating AI into the early stages
  of the design process, facilitating rapid prototyping and innovation in aerospace
  engineering. Consequently, the current work demonstrates the potential of AI-driven
  optimization to revolutionize UAV design by providing a robust and effective tool
  for solving complex engineering problems.</jats:p>
