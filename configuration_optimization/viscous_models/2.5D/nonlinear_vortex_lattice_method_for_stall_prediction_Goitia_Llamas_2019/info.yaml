abstract: <jats:p>The stall behavior of an empennage is a crucial and conditioning
  factor for its design. Thus, the preliminary design of empennages requires a fast
  low-order method which reliably computes the stall behavior and which must be sensitive
  to the design parameters (taper, sweep, dihedral, airfoil, etc.). Handbook or semi-empirical
  methods typically have a narrow scope and low fidelity, so a more general and unbiased
  method is desired. This paper presents a nonlinear vortex lattice method (VLM) for
  the stall prediction of generic fuselage-empennage configurations which is able
  to compute complete aerodynamic polars up to and beyond stall. The method is a generalized
  form of the van Dam algorithm, which couples the potential VLM solution with 2.5D
  viscous data. A novel method for computing 2.5D polars from 2D polars is presented,
  which extends the traditional infinite swept wing theory to finite wings, relying
  minimally on empirical data. The method has been compared to CFD and WTT results,
  showing a satisfactory degree of accuracy for the preliminary design of empennages.</jats:p>
