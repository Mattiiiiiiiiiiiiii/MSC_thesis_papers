abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>An overview
  of the basic theory of iterative methods for solving systems of nonlinear equations
  is presented. The emphasis is on considering the methods as discrete‐time, dynamical
  systems, where examples of the complicated process flows call for adaptive controls.
  Overviews of existence theories, condition numbers, convergence orders, and basic
  convergence results are given. Principal members of the class of linearization methods
  are surveyed, including Newton's method and related forms, as well as some Broyden
  and inexact Newton methods. Then, equations arising in parameterized problems are
  considered and an introduction to the computational analysis of their solution manifolds
  and the related bifurcation problems is given. In the case of one‐dimensional manifolds,
  this includes a discussion of some continuation methods.</jats:p>"
author: Rheinboldt, Werner C.
