abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>\n                    The
  discontinuous Galerkin (DG) methods are locally conservative, high‐order accurate,
  robust methods that can easily handle elements of arbitrary shapes, irregular meshes
  with hanging nodes, and polynomial approximations of different degrees in different
  elements. These properties, which render them ideal for\n                    <jats:italic>hp</jats:italic>\n
  \                   ‐adaptivity in domains of complex geometry, have brought them
  to the main stream of computational fluid dynamics. We study the properties of the
  DG methods as applied to a wide variety of problems arising in fluid dynamics with
  a special emphasis on linear, symmetric positive hyperbolic systems, the Euler equations
  of gas dynamics, purely elliptic problems, and the incompressible and compressible
  Navier–Stokes equations. In each instance, we discuss the main properties of the
  methods, display the mechanisms that make them work so well, and present numerical
  experiments showing their performance.\n                  </jats:p>"
