abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>This chapter
  is a revised, updated, and extended version of the chapter with the same title in
  the first issue of the “Encyclopedia of Computational Mechanics.” It provides an
  overview of modeling and discretization aspects in finite element analysis of thin‐walled
  structures. Shell formulations based on derivation from three‐dimensional continuum
  mechanics, the direct approach, and the degenerated solid concept are compared,
  highlighting conditions for their equivalence.</jats:p>\n                  <jats:p>Rather
  than individually describing the innumerable contributions to theories and finite
  element formulations for plates and shells, the essential assumptions in modeling
  and discretization, along with their consequences, are discussed. It is hoped that
  this approach comprises a good amount of the existing literature by including most
  concepts in a generic format.</jats:p>\n                  <jats:p>The contribution
  focuses on nonlinear finite element formulations for large displacements and rotations
  in the context of elastostatics, including some remarks on stability. Problems involving
  material nonlinearities and dynamics are other important topics, but these are outside
  the scope of the present chapter.</jats:p>"
